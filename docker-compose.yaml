services:

  server:
    build:
      context: ./services/server
      dockerfile: Dockerfile
    container_name: server
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - BATCH_SIZE=8
    ports:
      - 5678:5678

  client_0:
    <<: &client
      build:
        context: ./services/client
        dockerfile: Dockerfile
      depends_on:
        - server
      environment:
        - SERVER_HOST=server
        - SERVER_PORT=5678
    container_name: client_0
    environment:
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - AGENCY_ID=0
      - INPUT_FILE=/input/input-0.csv
      - OUTPUT_FILE=/output/output-0.csv
      - BATCH_SIZE=8
    volumes:
      - ./input:/input
      - ./output:/output

  client_1:
    <<: *client
    container_name: client_1
    environment:
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - AGENCY_ID=1
      - INPUT_FILE=/input/input-1.csv
      - OUTPUT_FILE=/output/output-1.csv
      - BATCH_SIZE=8
    volumes:
      - ./input:/input
      - ./output:/output

  client_2:
    <<: *client
    container_name: client_2
    environment:
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - AGENCY_ID=2
      - INPUT_FILE=/input/input-2.csv
      - OUTPUT_FILE=/output/output-2.csv
      - BATCH_SIZE=8
    volumes:
      - ./input:/input
      - ./output:/output

  client_3:
    <<: *client
    container_name: client_3
    environment:
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - AGENCY_ID=3
      - INPUT_FILE=/input/input-3.csv
      - OUTPUT_FILE=/output/output-3.csv
      - BATCH_SIZE=8
    volumes:
      - ./input:/input
      - ./output:/output

  client_4:
    <<: *client
    container_name: client_4
    environment:
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - AGENCY_ID=4
      - INPUT_FILE=/input/input-4.csv
      - OUTPUT_FILE=/output/output-4.csv
      - BATCH_SIZE=8
    volumes:
      - ./input:/input
      - ./output:/output
